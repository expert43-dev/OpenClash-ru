name: Russian OpenClash APK

on:
  push:
    branches: [codex/russian-localization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build isolated toolchain
        run: docker build -t openclash-ru-builder -f tools/Dockerfile .
      - name: Check catalog, Lua, JavaScript and parsers
        run: docker run --rm -v "$PWD:/src" openclash-ru-builder python3 tools/check_localization.py
      - name: Build and verify APK
        run: docker run --rm -v "$PWD:/src" openclash-ru-builder python3 tools/build_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: openclash-ru-apk
          path: |
            dist/*
            build/localization-report.json
